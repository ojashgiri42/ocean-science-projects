# Conda environment for the notebooks in this repository.
# Versions match the environment that produced the saved notebook outputs.
name: oceanscienceprojects
channels:
  - conda-forge
dependencies:
  - python=3.13
  - numpy=2.5.2
  - pandas=3.0.5
  - xarray=2026.7.0
  - netcdf4=1.7.4 
  - matplotlib=3.10.9
  - scipy=1.18.0
  - cartopy=0.25.0
  - requests=2.34.2
  - scikit-learn=1.9.0
  - jupyterlab=4.6.3
  - ipykernel=7.3.0
